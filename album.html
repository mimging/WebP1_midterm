<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>앨범</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fdfdfd;
    }

    /* 네비게이션 바 */
    nav {
      background-color: #f0f0f0;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      color: #000;
      margin-right: 15px;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 15px;
      margin: 0;
      padding: 0;
    }
    .dropdown {
      position: relative;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: white;
      border: 1px solid #ccc;
      z-index: 1000;
    }
    .dropdown:hover .dropdown-menu {
      display: block;
    }
    .dropdown-menu a {
      display: block;
      padding: 8px 12px;
      color: black;
      white-space: nowrap;
    }

    /* 카드 컨테이너 */
    .card-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
    }
    .card {
      background: white;
      width: 280px;
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 2px 2px 10px black;
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .card-body {
      padding: 15px;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0 0 10px;
    }
    .card-text {
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    .btn {
      display: inline-block;
      background-color: blue;
      color: white;
      padding: 8px 12px;
      text-decoration: none;
      border-radius: 5px;
      font-size: 0.9rem;
    }
    btn:hover {
      background-color: blue;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">김민서</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="link.html">Link</a></li>
      <li class="dropdown">
        <a href="#">AboutMe</a>
        <div class="dropdown-menu">
          <a href="im.html">I'm..</a>
          <a href="album.html">Album</a>
        </div>
      </li>
    </ul>
  </nav>
  <div class="card-container">
    <div class="card">
      <img src="img/내 사진.jpg" alt="나">
      <div class="card-body">
        <h5 class="card-title">나</h5>
        <p class="card-text">명지대학교 60230988 응용소프트웨어전공 김민서</p>
      </div>
    </div>
    <div class="card">
      <img src="img/윤택.jpg" alt="오윤택">
      <div class="card-body">
        <h5 class="card-title">오윤택</h5>
        <p class="card-text">26살, 김민서의 남자친구이다. MUJI에서 알바하다가 만났다.</p>
      </div>
    </div>
    <div class="card">
      <img src="img/취미.jpg" alt="취미">
      <div class="card-body">
        <h5 class="card-title">취미</h5>
        <p class="card-text">요즘 제일 좋아하는 취미는 베이킹..! 학기중에는 바빠서 못하고 있다.</p>
      </div>
    </div>
    <div class="card">
      <img src="img/검도.jpg" alt="동아리">
      <div class="card-body">
        <h5 class="card-title">동아리</h5>
        <p class="card-text">명지대학교 중앙동아리 무릉도원에서 검도를 하고 있다!</p>
      </div>
    </div>
    <div class="card">
      <img src="img/뉴진스.jpg" alt="뉴진스">
      <div class="card-body">
        <h5 class="card-title">뉴진스</h5>
        <p class="card-text">내가 가장 좋아하는 아이돌이다. 앞으로 어떻게 될지 모르겠지만..</p>
        <a href="https://youtu.be/ft70sAYrFyY?si=TJa3YAei2qDahnLb" class="btn">Music Vidio</a>
      </div>
    </div>
  </div>
</body>
</html>
