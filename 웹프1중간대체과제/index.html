<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Website</title>
  <style>
    /*navbar*/
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .navbar {
      background-color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar a {
      text-decoration: none;
      color: black;
      margin: 0 10px;
    }
    .navbar ul {
      list-style: none;
      display: flex;
      padding: 0;
      margin: 0;
    }
    .navbar li {
      position: relative;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      background-color: white;
      top: 100%;
      left: 0;
      min-width: 150px;
      box-shadow: 0 2px 5px black;
    }
    .dropdown-menu a {
      display: block;
      padding: 10px;
      color: black;
    }
    .dropdown:hover .dropdown-menu {
      display: block;
    }
    /* Carousel */
    .carousel {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      overflow: hidden;
    }
    .carousel-inner {
      display: flex;
      transition: transform 0.5s ease;
      width: 400%;
    }
    .carousel-item {
      min-width: 100%;
    }
    .carousel {
  position: relative;
  max-width: 100%;
  height: 50%;
  margin: 30px auto;
  overflow: hidden;
}
    .carousel-control {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      background-color: black;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
    }
    .carousel-control.prev {
      left: 10px;
    }
    .carousel-control.next {
      right: 10px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html">김민서</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="link.html">Link</a></li>
      <li class="dropdown">
        <a href="#">AboutMe</a>
        <ul class="dropdown-menu">
          <li><a href="im.html">나의 과거, 현재, 미래</a></li>
          <li><a href="album.html">Album</a></li>
        </ul>
      </li>
    </ul>
  </nav>

  <div class="carousel" id="carousel">
    <div class="carousel-inner" id="carousel-inner">
      <div class="carousel-item"><img src="img/snow.jpg" alt="눈 덮힌 명지"></div>
      <div class="carousel-item"><img src="img/fall.jpg" alt="가을의 명지"></div>
      <div class="carousel-item"><img src="img/spring.jpg" alt="봄의 명지"></div>
      <div class="carousel-item"><img src="img/night.jpg" alt="명지"></div>
    </div>
    <button class="carousel-control prev" onclick="prevSlide()">&#10094;</button>
    <button class="carousel-control next" onclick="nextSlide()">&#10095;</button>
  </div>

  <script>
    let currentIndex = 0;
    const carouselInner = document.getElementById("carousel-inner");
    const totalItems = document.querySelectorAll(".carousel-item").length;

    function updateCarousel() {
      const offset = -100 * currentIndex;
      carouselInner.style.transform = `translateX(${offset}%)`;
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % totalItems;
      updateCarousel();
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + totalItems) % totalItems;
      updateCarousel();
    }
  </script>

</body>
</html>
