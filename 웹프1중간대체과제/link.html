<!DOCTYPE html>

  <meta charset="UTF-8">
  <title>자주 쓰는 링크</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }

    /* 네비게이션 바 */
    nav {
      background: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      color: black;
      margin-right: 15px;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 15px;
      margin: 0;
      padding: 0;
    }

    /* 드롭다운 */
    .dropdown {
      position: relative;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      top: 100%;
      left: 0;
      z-index: 1000;
    }
    .dropdown-menu a {
      display: block;
      padding: 8px 12px;
      color: #000;
    }
    .dropdown:hover .dropdown-menu {
      display: block;
    }

    /* 표 스타일 */
    table {
      width: 80%;
      margin: 30px auto;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    thead {
      background: white;
    }
    a {
      color: blue;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
